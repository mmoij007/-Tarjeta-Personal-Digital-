<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Personal Digital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="card-header">
            <img src="https://via.placeholder.com/150" alt="Foto de perfil" class="profile-img">
        </div>
        <div class="card-body">
            <h1 class="name">Tu Nombre</h1>
            <p class="profession">Tu Profesión</p>
            <p class="bio">Una breve biografía sobre ti. Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
            <div class="contact-info">
                <div class="info-item">
                    <i class="fas fa-globe"></i>
                    <a href="#">tu-website.com</a>
                </div>
                <div class="info-item">
                    <i class="fab fa-linkedin"></i>
                    <a href="#">/tu-linkedin</a>
                </div>
                <div class="info-item">
                    <i class="fas fa-phone"></i>
                    <a href="tel:123456789">123-456-789</a>
                </div>
                <div class="info-item">
                    <i class="fas fa-envelope"></i>
                    <a href="mailto:tu.email@example.com">tu.email@example.com</a>
                </div>
                <div class="info-item">
                    <i class="fab fa-whatsapp"></i>
                    <a href="https://wa.me/123456789">Envíame un mensaje</a>
                </div>
            </div>
        </div>
        <div class="card-footer">
            <div id="qrcode"></div>
        </div>
    </div>

    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
