<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Personal Digital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="card-header">
            <img src="https://via.placeholder.com/150" alt="Foto de perfil" class="profile-img">
        </div>
        <div class="card-body">
            <h1 class="name">Tu Nombre</h1>
            <p class="profession">Tu Profesión</p>
            <p class="bio">Una breve biografía sobre ti. Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
            <div class="social-links">
                <a href="#" class="link-btn" aria-label="Website"><i class="fas fa-globe"></i></a>
                <a href="#" class="link-btn" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
                <a href="#" class="link-btn" aria-label="GitHub"><i class="fab fa-github"></i></a>
                <a href="tel:123456789" class="link-btn" aria-label="Teléfono"><i class="fas fa-phone"></i></a>
                <a href="mailto:tu.email@example.com" class="link-btn" aria-label="Email"><i class="fas fa-envelope"></i></a>
                <a href="https://wa.me/123456789" class="link-btn" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
            </div>
            <div class="action-buttons">
                <a href="https://calendly.com/tu-usuario" target="_blank" class="action-btn">Agendar Reunión</a>
                <button class="action-btn" id="save-contact">Guardar Contacto</button>
            </div>
        </div>
        <div class="card-footer">
            <div id="qrcode"></div>
        </div>
    </div>

    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
